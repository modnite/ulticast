name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies (FFmpeg, NVENC headers, CEF)
        shell: pwsh
        run: ./tools/fetch-deps.ps1

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage distributable (dist/)
        shell: pwsh
        run: |
          $r = "build/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$r/ulticast.exe","$r/ulticast-ui.exe" dist
          Copy-Item "$r/*.dll" dist
          Copy-Item "$r/*.pak","$r/*.bin","$r/icudtl.dat" dist
          Copy-Item "$r/locales" dist -Recurse
          Copy-Item "THIRD_PARTY_NOTICES.md" dist
          Get-ChildItem dist | Select-Object Name,Length | Format-Table -AutoSize

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "installer\ulticast.iss"

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "Ulticast-portable-${{ github.ref_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ulticast-windows
          path: Ulticast-portable-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ulticast-portable-*.zip
            installer/Output/Ulticast-Setup-*.exe
